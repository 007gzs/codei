[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/007gzs/codei"
authors = ["007gzs <007gzs@gmail.com>"]
description = "CodeI ai-coding agent"
readme = "README.md"
keywords = ["codei", "ai-coding", "agent", "openai"]


[workspace.lints.rust]

[workspace.lints.clippy]


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
directories = "5"
rust-i18n = "4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
walkdir = "2"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
similar = "2"
glob = "0.3"
tokio-stream = "0.1"
unicode-width = "0.2"
arboard = "3"

# Internal crates (path + version required for `cargo publish`)
codei-config = { version = "0.0.9", path = "crates/codei-config" }
codei-i18n = { version = "0.0.9", path = "crates/codei-i18n" }
codei-llm = { version = "0.0.9", path = "crates/codei-llm" }
codei-mcp = { version = "0.0.9", path = "crates/codei-mcp" }
codei-session = { version = "0.0.9", path = "crates/codei-session" }
codei-tools = { version = "0.0.9", path = "crates/codei-tools" }
codei-commands = { version = "0.0.9", path = "crates/codei-commands" }
codei-agent = { version = "0.0.9", path = "crates/codei-agent" }
codei-tui = { version = "0.0.9", path = "crates/codei-tui" }
codei-sdk = { version = "0.0.9", path = "crates/codei-sdk" }
codei = { version = "0.0.9", path = "crates/codei-cli" }
